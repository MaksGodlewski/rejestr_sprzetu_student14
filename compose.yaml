services:
  web:
    build: .
    image: rejestr-sprzetu:latest
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-rejestr}
      DB_USER: ${POSTGRES_USER:-rejestr}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w pliku .env}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rejestr}
      POSTGRES_USER: ${POSTGRES_USER:-rejestr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rejestr} -d ${POSTGRES_DB:-rejestr}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  # opcjonalny podgląd bazy: docker compose --profile tools up -d
  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports:
      - "8080:8080"
    networks:
      - frontend
      - backend

volumes:
  pgdata:

networks:
  frontend:
  backend:
    internal: true   # baza nie ma dostępu do internetu ani portów na hoście
