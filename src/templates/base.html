<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Rejestr sprzętu{% endblock %}</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#f3f5f8;color:#1f2933}
  nav{background:#2f5d8a;padding:.8rem 2rem;display:flex;gap:1.5rem;align-items:center}
  nav strong{color:#fff;margin-right:1rem}
  nav a{color:#dbe7f3;text-decoration:none}
  nav a:hover{color:#fff}
  main{max-width:1000px;margin:1.5rem auto;padding:0 1rem}
  .card{background:#fff;border-radius:8px;padding:1rem 1.2rem;margin-bottom:1.2rem;
        box-shadow:0 1px 3px rgba(0,0,0,.1)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:.5rem;border-bottom:1px solid #e4e7eb}
  form.inline{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end}
  label{display:flex;flex-direction:column;font-size:.85rem;gap:.2rem}
  input,select{padding:.4rem;border:1px solid #bcccdc;border-radius:4px}
  button{background:#2f5d8a;color:#fff;border:0;border-radius:4px;padding:.5rem .9rem;cursor:pointer}
  button.small{padding:.25rem .6rem}
  .badge{padding:.15rem .6rem;border-radius:99px;font-size:.8rem}
  .available{background:#d4f1dc;color:#1e6b36}
  .loaned{background:#fdebc8;color:#8a5a00}
  .overdue{background:#fbd5d5;color:#a11}
  .flash{padding:.6rem 1rem;border-radius:6px;margin-bottom:1rem}
  .flash.ok{background:#d4f1dc}.flash.error{background:#fbd5d5}
</style>
</head>
<body>
<nav>
  <strong>Rejestr sprzętu</strong>
  <a href="{{ url_for('index') }}">Katalog</a>
  <a href="{{ url_for('loans') }}">Wypożyczenia</a>
</nav>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
